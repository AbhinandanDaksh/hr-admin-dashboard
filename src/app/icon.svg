<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="hrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#e11d48" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#hrGrad)" filter="url(#glow)" />

  <!-- Stylized Geometric HR Emblem -->
  <!-- Left Pillar 'H' -->
  <rect x="7" y="9" width="3" height="14" rx="1.5" fill="#ffffff" />
  
  <!-- Right Pillar 'R' loop & leg -->
  <rect x="15" y="9" width="3" height="14" rx="1.5" fill="#ffffff" />
  
  <!-- Cross bar connecting H & R -->
  <rect x="7" y="14.5" width="11" height="3" rx="1.5" fill="#ffffff" />
  
  <!-- R Loop curve -->
  <path d="M 16.5 9 C 20 9 22.5 10.5 22.5 13 C 22.5 15.5 20 17 16.5 17" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />

  <!-- R Leg diagonal -->
  <path d="M 19 16.5 L 23.5 23" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" />

  <!-- Accent Talent Node Dot -->
  <circle cx="24.5" cy="7.5" r="2" fill="#fed7aa" />
</svg>
